# @package _global_
# GalaxeaVLA-main\configs\task
# YAM 微调任务配置（自 configs/task/r1lite.yaml 复制，仅改 3 处，已用注释标出）
# 动作布局与 r1lite 完全一致：raw 14D（6+1, 6+1），merger pad 后 27D，
# 因此 action_dim/proprio_dim/parts_meta/merge_spec 全部沿用 r1lite，不要新建 parts_meta。
defaults:
- override /model: g05
- override /tokenizer: actioncodec
- override /data: yam          # ← 改动 1：指向 configs/data/yam.yaml
- _self_
shard_datasets_by_node: false
use_fsdp: false
fsdp_sharding_strategy: hybrid
fsdp_mixed_precision: false
fsdp_prefetch: true
fsdp_reshard_after_forward: true
vlm:
  cotrain: false
  batch_size: ${model.batch_size}
  num_workers: 4
  vlm_batch_ratio: 0.2
  loss_weight: 1.0
datastatics_path: data/stats/yam_stats.json   # ← 改动 2：第 4 步算出的 YAM stats
deploy_checkpoint:
  enabled: true
tokenizer:
  vq_config:
    # ← 改动 3：微调后的 YAM codec；基线对照时注释掉本行（用官方 checkpoints/action_tokenizer.pt）
    ckpt_dir: checkpoints/action_tokenizer_yam.pt
    block_wise_autoregressive: false
    block_size: 8
    num_residuals: 2
    rule_based_key_patterns:
    - gripper
    rule_based_binarize_threshold: 0.0
    use_group_markers: true
    group_order_shuffle: false
    dropout_noop_parts: true
    absent_key_fill_value: -100.0
    parts_meta:
      left_control: 9
      left_gripper: 1
      right_control: 9
      right_gripper: 1
      lower_body: 7
    model_arch:
      codebook_size: 4096
      # ← 微调稳定性：默认 ema_decay=0.95 / threshold_ema_dead=2 / quantizer_dropout=0.5
      #   会在「满利用率预训练码本 → 窄域(YAM 单任务)」微调时导致码本坍塌
      #   (utilization 100%→0.7%, commitment_loss 震荡, RMSE 劣于基线)。
      #   threshold_ema_dead<=0 禁用死码重置；ema_decay 提高减缓码本漂移；关 dropout。
      ema_decay: 0.99
      threshold_ema_dead: 0
      quantizer_dropout: 0.0
model:
  use_8bit_optimizer: false
  learning_rate: 4.0e-05
  batch_size: 8
  num_workers: 16
  prefetch_factor: 4
  max_epochs: 10
  warmup_ratio: null
  warmup_steps: 200
  lr_scheduler_type: cosine
  lr_min_ratio: 0.0
  constant_end_ratio: 0.08
  weight_decay: 0.03
  # Differential LR: finetune.py reads these from model top-level (cfg.model.get),
  # NOT from model_arch. Placed under model_arch they are silently ignored.
  vision_lr_multiplier: 0.1
  backbone_lr_multiplier: 1.0
  processor:
    vlm_input_action_norm_default_mode: null
    vlm_input_action_norm_exception_mode: null
    tokenizer_params:
      local_files_only: true
    camera_size_config:
      exterior: [256, 256]
      wrist_left: [256, 256]
      wrist_right: [256, 256]
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.DummyActionFilter
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/r1lite.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/r1lite.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/r1lite.yaml,merge_spec}
      merge: true
  model_arch:
    action_dim: 27
    proprio_dim: 27
    fm:
      num_flow_samples: 4
    ar:
      block_wise_autoregressive: false
    predict_cot: false
    input_preprocessor:
      pred_eov: false
