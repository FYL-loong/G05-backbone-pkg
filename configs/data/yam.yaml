# YAM 双臂数据配置（自 configs/data/r1lite.yaml 复制改 3 处）
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
use_weight_normalization: true
use_weight_for_sampling: false
action_size: 32
past_action_size: 0
obs_size: 1
obs_stride_second: 0.0
# episode-level 80/20 划分。
#
# ⚠️ 多数据集下切分方式的真实行为（已核对 base_lerobot_dataset.py:281-297）：
#   代码先把各 dataset_dir 的 episode 列表【按顺序拼接】，再在拼接结果上按
#       split_ep = int(total_episodes * (1 - val_set_proportion))
#   切一刀。所以 10 个任务（991 条）时：
#       split_ep = int(991 × 0.8) = 792
#       train = 前 8 个任务（0001..0013）  = 792 条
#       val   = 后 2 个任务（0014, 0015）  = 199 条
#   即：验证集是【留出的两个完整任务】，不是每个任务各取 20%。
#   episode 本身不跨切分点（符合"不能让一个 episode 跨 train/val"）。
#   含义：validation 衡量的是「held-out 任务的零样本表现」，验证 loss 偏高
#   不代表训练失败。选 best checkpoint 时要意识到这个偏向。
#
# 官方 r1lite 默认 1e-4，在 100 条 episode 上只会切出【最后 1 条】作验证集，
# 验证指标基本无意义，无法判断过拟合 —— 所以这里改成 0.2。
val_set_proportion: 0.2
is_training_set: true
processors:
  galaxea_r1lite:
    shape_meta:
      action:
      - {key: left_arm, lerobot_key: action.left_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: left_gripper, lerobot_key: action.left_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      - {key: right_arm, lerobot_key: action.right_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: right_gripper, lerobot_key: action.right_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      state:
      - {key: left_arm, lerobot_key: observation.state.left_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: left_gripper, lerobot_key: observation.state.left_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      - {key: right_arm, lerobot_key: observation.state.right_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: right_gripper, lerobot_key: observation.state.right_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      images:
      - {key: head_rgb, camera_type: exterior, lerobot_key: observation.images.head_rgb, start_index: 0, raw_shape: [3, 480, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: left_wrist_rgb, camera_type: wrist_left, lerobot_key: observation.images.left_wrist_rgb, start_index: 0, raw_shape: [3, 480, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: right_wrist_rgb, camera_type: wrist_right, lerobot_key: observation.images.right_wrist_rgb, start_index: 0, raw_shape: [3, 480, 640], shape: [3, 224, 224], time_offset: 0}
    action_state_transforms:
    - _target_: g05.data_processor.transforms.relative_action.RelativeJointTransform
      keys:
      - left_arm
      - right_arm
    train_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,train_head}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
    val_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
    norm_default_mode: z-score-tail
    norm_exception_mode:
      action:
        left_gripper: q01/q99
        right_gripper: q01/q99
      state:
        left_gripper: q01/q99
        right_gripper: q01/q99
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.DummyActionFilter
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.PaddingActionMerger
      merge: true
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/r1lite.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/r1lite.yaml,parts_meta}
    num_obs_steps: 1
    use_stepwise_action_norm: true
    drop_high_level_prob: 1.0
    use_zh_instruction: false
embodiment_datasets:
  galaxea_r1lite:
    type: g05.data.galaxea_lerobot_dataset.GalaxeaLerobotDataset
    embodiment_type: galaxea_r1lite
    lerobot_ds_version: '3.0'
    shape_meta:
      action:
      - {key: left_arm, lerobot_key: action.left_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: left_gripper, lerobot_key: action.left_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      - {key: right_arm, lerobot_key: action.right_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: right_gripper, lerobot_key: action.right_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      state:
      - {key: left_arm, lerobot_key: observation.state.left_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: left_gripper, lerobot_key: observation.state.left_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      - {key: right_arm, lerobot_key: observation.state.right_arm, start_index: 0, raw_shape: 6, shape: 6, time_offset: 0}
      - {key: right_gripper, lerobot_key: observation.state.right_gripper, start_index: 0, raw_shape: 1, shape: 1, time_offset: 0}
      images:
      - {key: head_rgb, camera_type: exterior, lerobot_key: observation.images.head_rgb, start_index: 0, raw_shape: [3, 480, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: left_wrist_rgb, camera_type: wrist_left, lerobot_key: observation.images.left_wrist_rgb, start_index: 0, raw_shape: [3, 480, 640], shape: [3, 224, 224], time_offset: 0}
      - {key: right_wrist_rgb, camera_type: wrist_right, lerobot_key: observation.images.right_wrist_rgb, start_index: 0, raw_shape: [3, 480, 640], shape: [3, 224, 224], time_offset: 0}
    dataset_groups:
    - weight: 1.0
      dataset_dirs:
      - data/yam/TASK-YAM-0001_lerobot
      - data/yam/TASK-YAM-0002_lerobot
      - data/yam/TASK-YAM-0004_lerobot
      - data/yam/TASK-YAM-0006_lerobot
      - data/yam/TASK-YAM-0007_lerobot
      - data/yam/TASK-YAM-0008_lerobot
      - data/yam/TASK-YAM-0010_lerobot
      - data/yam/TASK-YAM-0013_lerobot
      - data/yam/TASK-YAM-0014_lerobot
      - data/yam/TASK-YAM-0015_lerobot